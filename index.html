<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wordixon Search</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/correct_logo.jpg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet" />
  <meta property="og:image" content="https://zrobertson350-boop.github.io/matrix/assets/correct_logo.jpg" />
</head>
<body>
  <header>
    <img src="logo-full.png" alt="Wordixon logo" class="logo" />
  </header>

  <input id="searchBox" placeholder="define yourself..." />
  <p class="search-hint">Click any definition card to play a short animated definition video.</p>
  <ul id="results"></ul>

  <div id="definitionShort" class="short-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="shortWord">
    <div class="short-player">
      <button id="closeShort" class="close-short" type="button" aria-label="Close definition short">✕</button>
      <div class="short-video" id="shortVideo">
        <p class="short-label">Definition Short</p>
        <h2 id="shortWord"></h2>
        <p id="shortPart" class="short-part"></p>
        <p id="shortDefinition" class="short-definition"></p>
        <p id="shortExample" class="short-example"></p>
        <div class="short-progress">
          <span id="shortProgressBar"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
